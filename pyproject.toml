[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "device-security-check"
version = "0.1.0"
description = "100% offline Windows CLI security posture and app-privilege auditor for non-rooted Android devices over ADB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
device-scan = "device_scan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/device_scan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
